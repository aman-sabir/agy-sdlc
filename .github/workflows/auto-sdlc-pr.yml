name: Auto-SDLC Open Pull Request

on:
  push:
    branches:
      - 'auto-sdlc/**'
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Open Pull Request for Autonomous Coder Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, glob

          branch = os.environ["BRANCH_NAME"]
          repo = os.environ["REPO"]
          issue_key = branch.split("/")[-1]

          title = f"feat({issue_key}): Autonomous Agentic Implementation"
          body = f"Automated implementation generated by Google ADK Coding Agent for Jira issue `{issue_key}`."

          meta_files = glob.glob("**/pr_metadata.json", recursive=True)
          if meta_files:
              with open(meta_files[0], "r", encoding="utf-8") as f:
                  meta = json.load(f)
                  title = meta.get("title", title)
                  body = meta.get("body", body)
          else:
              guides = glob.glob("**/IMPLEMENTATION_GUIDE.md", recursive=True)
              if guides:
                  with open(guides[0], "r", encoding="utf-8") as f:
                      body = f.read()[:60000]

          res = subprocess.run(
              ["gh", "pr", "list", "--repo", repo, "--head", branch, "--json", "number,url"],
              capture_output=True, text=True
          )
          prs = json.loads(res.stdout or "[]")
          if prs:
              print("PR already exists:", prs[0]["url"])
          else:
              with open("/tmp/pr_body.md", "w", encoding="utf-8") as bf:
                  bf.write(body)
              create_res = subprocess.run(
                  ["gh", "pr", "create", "--repo", repo, "--base", "main", "--head", branch, "--title", title, "--body-file", "/tmp/pr_body.md"],
                  capture_output=True, text=True
              )
              print("STDOUT:", create_res.stdout)
              print("STDERR:", create_res.stderr)
              create_res.check_returncode()
          EOF
