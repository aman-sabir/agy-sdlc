name: Auto-SDLC CI & Pull Request

on:
  push:
    branches:
      - 'auto-sdlc/**'
      - 'feature/**'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify-and-open-pr:
    name: Automated Pytest Verification & PR Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Run Pytest Suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic fastapi httpx
          for svc_dir in services/*; do
            if [ -d "$svc_dir/tests" ]; then
              echo "Running pytest for $svc_dir..."
              PYTHONPATH="$svc_dir/src:$svc_dir" pytest "$svc_dir/tests" -v
            fi
          done

      - name: Create or Update Pull Request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, glob

          branch = os.environ["BRANCH_NAME"]
          repo = os.environ["REPO"]
          issue_key = branch.split("/")[-1]

          title = f"feat({issue_key}): Autonomous Agentic Implementation"
          body = f"Automated implementation generated by Google ADK Coding Agent for Jira issue `{issue_key}`."

          meta_files = glob.glob("**/pr_metadata.json", recursive=True)
          if meta_files:
              with open(meta_files[0], "r", encoding="utf-8") as f:
                  meta = json.load(f)
                  title = meta.get("title", title)
                  body = meta.get("body", body)
          else:
              guides = glob.glob("**/IMPLEMENTATION_GUIDE.md", recursive=True)
              if guides:
                  with open(guides[0], "r", encoding="utf-8") as f:
                      body = f.read()[:60000]

          res = subprocess.run(
              ["gh", "pr", "list", "--repo", repo, "--head", branch, "--json", "number,url"],
              capture_output=True, text=True
          )
          prs = json.loads(res.stdout or "[]") if res.returncode == 0 else []
          if prs:
              print("PR already exists:", prs[0]["url"])
          else:
              with open("/tmp/pr_body.md", "w", encoding="utf-8") as bf:
                  bf.write(body)
              create_res = subprocess.run(
                  ["gh", "pr", "create", "--repo", repo, "--base", "main", "--head", branch, "--title", title, "--body-file", "/tmp/pr_body.md"],
                  capture_output=True, text=True
              )
              if create_res.returncode == 0:
                  print("Opened PR:", create_res.stdout)
              else:
                  print(f"Branch pushed and verified! Compare/PR URL: https://github.com/{repo}/compare/main...{branch}?expand=1")
          EOF
