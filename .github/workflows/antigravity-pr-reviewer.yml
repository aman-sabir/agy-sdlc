name: Antigravity Compliance PR Reviewer

on:
  issue_comment:
    types: [created]

jobs:
  compliance-review:
    name: Code Quality Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' && github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/review-managed-agent')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Post Status Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$PR_NUMBER" --repo "$REPO" --body "The autonomous Antigravity agent is working on it."

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai>=2.3.0

      - name: Run Antigravity Review
        env:
          REVIEWER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          REPO="${{ github.repository }}"
          PROMPT="Review pull request #$PR_NUMBER in repository $REPO and write your review as comments directly on the PR"
          echo "$PROMPT" | python .github/scripts/pr_review.py
